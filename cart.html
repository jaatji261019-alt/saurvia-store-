<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Your Cart - SAURVIA
  </title>

  <!-- MAIN CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- CART CSS -->
  <link rel="stylesheet" href="cart.css">

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <style>

    /* ================= OVERLAY ================= */
    .overlay-bg{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.45);
      opacity:0;
      visibility:hidden;
      transition:0.3s;
      z-index:9997;
    }

    .overlay-bg.show-overlay{
      opacity:1;
      visibility:visible;
    }

    /* ================= SIDEBAR FIX ================= */
    .sidebar{
      left:-280px;
      transition:0.35s;
    }

    .sidebar.show-sidebar{
      left:0;
    }

    /* ================= ACTIVE LINK ================= */
    .sidebar-nav a.active-link{
      background:rgba(255,255,255,0.2);
    }

    /* ================= CART PAGE ================= */
    .cart-page{
      width:100%;
      max-width:1300px;
      margin:auto;
      padding:30px 20px;
      display:grid;
      grid-template-columns:1.8fr 1fr;
      gap:30px;
    }

    /* ================= CART ITEM ================= */
    .cart-item{
      background:white;
      border-radius:24px;
      padding:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:20px;
      box-shadow:0 5px 16px rgba(0,0,0,0.08);
    }

    /* ================= IMAGE FIX ================= */
    .cart-item-image{
      flex-shrink:0;
    }

    .cart-product-image{
      width:80px;
      height:80px;
      object-fit:cover;
      border-radius:16px;
      border:2px solid #f2f2f2;
      background:#f5f5f5;
      display:block;
    }

    /* ================= INFO ================= */
    .cart-item-info{
      flex:1;
    }

    .cart-item-info h3{
      font-size:18px;
      margin-bottom:8px;
    }

    .cart-price{
      color:#ff5722;
      font-size:18px;
      font-weight:700;
      margin-bottom:12px;
    }

    /* ================= QTY ================= */
    .qty-box{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .qty-box button{
      width:34px;
      height:34px;
      border:none;
      border-radius:10px;
      background:#f1f1f1;
      font-size:18px;
      cursor:pointer;
      font-weight:700;
    }

    .qty-box button:hover{
      background:#ff5722;
      color:white;
    }

    /* ================= RIGHT ================= */
    .cart-item-right{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:12px;
    }

    .cart-item-right h4{
      font-size:20px;
    }

    /* ================= REMOVE ================= */
    .remove-btn{
      border:none;
      background:#ffe9e4;
      color:#ff5722;
      padding:10px 16px;
      border-radius:12px;
      font-weight:700;
      cursor:pointer;
    }

    .remove-btn:hover{
      background:#ff5722;
      color:white;
    }

    /* ================= SUMMARY ================= */
    .summary-card{
      background:white;
      border-radius:24px;
      padding:28px;
      box-shadow:0 5px 16px rgba(0,0,0,0.08);
      position:sticky;
      top:100px;
    }

    .summary-row,
    .summary-total{
      display:flex;
      justify-content:space-between;
      margin-bottom:18px;
    }

    .summary-total{
      border-top:1px solid #eee;
      padding-top:18px;
      font-size:22px;
      font-weight:800;
    }

    .checkout-btn,
    .clear-cart-btn{
      width:100%;
      border:none;
      padding:15px;
      border-radius:16px;
      cursor:pointer;
      font-weight:700;
      margin-top:14px;
    }

    .checkout-btn{
      background:linear-gradient(
        45deg,
        #ff9800,
        #ff5722
      );
      color:white;
    }

    .clear-cart-btn{
      background:#111;
      color:white;
    }

    /* ================= EMPTY CART ================= */
    .empty-cart{
      background:white;
      border-radius:24px;
      padding:50px 24px;
      text-align:center;
      box-shadow:0 5px 16px rgba(0,0,0,0.08);
    }

    .empty-cart img{
      width:120px;
      margin-bottom:20px;
    }

    .continue-btn{
      display:inline-block;
      padding:14px 24px;
      background:linear-gradient(
        45deg,
        #ff9800,
        #ff5722
      );
      color:white;
      text-decoration:none;
      border-radius:40px;
      margin-top:20px;
      font-weight:700;
    }

    /* ================= MOBILE ================= */
    @media(max-width:768px){

      .cart-page{
        grid-template-columns:1fr;
        padding:20px 14px;
      }

      .summary-card{
        position:static;
      }

      .cart-item{
        flex-direction:column;
        align-items:flex-start;
      }

      .cart-item-right{
        width:100%;
        flex-direction:row;
        justify-content:space-between;
        align-items:center;
      }

      .cart-product-image{
        width:70px;
        height:70px;
      }
    }

  </style>

</head>

<body>

<!-- ================= OVERLAY ================= -->
<div
  class="overlay-bg"
  id="overlay"
  onclick="toggleSidebar()"
></div>

<!-- ================= MENU BUTTON ================= -->
<div
  class="menu-btn"
  onclick="toggleSidebar()"
>

  <i class="fa-solid fa-bars"></i>

</div>

<!-- ================= SIDEBAR ================= -->
<aside
  class="sidebar"
  id="sidebar"
>

  <!-- LOGO -->
  <div class="sidebar-logo">

    <h2>
      SAURVIA
    </h2>

  </div>

  <!-- NAVIGATION -->
  <nav class="sidebar-nav">

    <a href="index.html">

      <i class="fa-solid fa-house"></i>

      Home

    </a>

    <a href="shop.html">

      <i class="fa-solid fa-shop"></i>

      Shop

    </a>

    <a href="wishlist.html">

      <i class="fa-solid fa-heart"></i>

      Wishlist

    </a>

    <a href="cart.html">

      <i class="fa-solid fa-cart-shopping"></i>

      Cart

    </a>

    <a href="checkout.html">

      <i class="fa-solid fa-credit-card"></i>

      Checkout

    </a>

    <a href="contact.html">

      <i class="fa-solid fa-phone"></i>

      Contact

    </a>

    <a href="about.html">

      <i class="fa-solid fa-circle-info"></i>

      About

    </a>

  </nav>

  <!-- CATEGORY BUTTON -->
  <div
    class="cat-toggle"
    onclick="toggleCategories()"
  >

    <i class="fa-solid fa-folder-open"></i>

    Categories

  </div>

  <!-- CATEGORY MENU -->
  <div
    class="sidebar-categories"
    id="catMenu"
  >

    <div
      class="side-cat"
      onclick="location.href='shop.html'"
    >

      <img
        src="images/skincare.jpg"
        alt="Skincare"
        onerror="this.src='https://via.placeholder.com/100';"
      >

      <span>
        Skincare
      </span>

    </div>

    <div
      class="side-cat"
      onclick="location.href='shop.html'"
    >

      <img
        src="images/perfume.jpg"
        alt="Perfume"
        onerror="this.src='https://via.placeholder.com/100';"
      >

      <span>
        Perfume
      </span>

    </div>

    <div
      class="side-cat"
      onclick="location.href='shop.html'"
    >

      <img
        src="images/haircare.jpg"
        alt="Haircare"
        onerror="this.src='https://via.placeholder.com/100';"
      >

      <span>
        Haircare
      </span>

    </div>

    <div
      class="side-cat"
      onclick="location.href='shop.html'"
    >

      <img
        src="images/beauty.jpg"
        alt="Beauty"
        onerror="this.src='https://via.placeholder.com/100';"
      >

      <span>
        Beauty
      </span>

    </div>

  </div>

</aside>

<!-- ================= HEADER ================= -->
<header class="top-header">

  <div class="center-box">

    <h1 class="logo">
      SAURVIA
    </h1>

  </div>

  <div class="cart-box">

    <a
      href="cart.html"
      class="cart-count"
    >

      🛒 Cart (
      <span id="cartCount">
        0
      </span>
      )

    </a>

  </div>

</header>

<!-- ================= CART PAGE ================= -->
<section class="cart-page">

  <!-- LEFT -->
  <div>

    <div class="cart-page-title">

      <h2>
        Your Shopping Cart 🛒
      </h2>

      <p>
        Premium beauty products selected for you
      </p>

    </div>

    <!-- ITEMS -->
    <div id="cart-items"></div>

  </div>

  <!-- RIGHT -->
  <div>

    <div class="summary-card">

      <h2>
        Order Summary
      </h2>

      <div id="total"></div>

    </div>

  </div>

</section>

<!-- ================= EMPTY TEMPLATE ================= -->
<div
  id="empty-cart-template"
  style="display:none;"
>

  <div class="empty-cart">

    <img
      src="https://cdn-icons-png.flaticon.com/512/2038/2038854.png"
      alt="Empty Cart"
    >

    <h2>
      Your Cart Is Empty 🛒
    </h2>

    <p>
      Looks like you haven't added anything yet.
    </p>

    <a
      href="shop.html"
      class="continue-btn"
    >

      Continue Shopping

    </a>

  </div>

</div>

<!-- ================= SCRIPT ================= -->
<script>

  /* ================= SIDEBAR ================= */
  function toggleSidebar(){

    document
      .getElementById("sidebar")
      .classList.toggle(
        "show-sidebar"
      );

    document
      .getElementById("overlay")
      .classList.toggle(
        "show-overlay"
      );
  }

  /* ================= UPDATE COUNT ================= */
  function updateCartCount(){

    let cart =
      JSON.parse(
        localStorage.getItem("cart")
      ) || [];

    let totalItems = 0;

    cart.forEach(item => {

      totalItems +=
        item.qty || 1;

    });

    document.getElementById(
      "cartCount"
    ).innerText = totalItems;
  }

  /* ================= RENDER CART ================= */
  function renderCartPage(){

    let cart =
      JSON.parse(
        localStorage.getItem("cart")
      ) || [];

    let container =
      document.getElementById(
        "cart-items"
      );

    let totalBox =
      document.getElementById(
        "total"
      );

    container.innerHTML = "";

    let total = 0;

    /* EMPTY */
    if(cart.length === 0){

      container.innerHTML =
        document.getElementById(
          "empty-cart-template"
        ).innerHTML;

      totalBox.innerHTML = "";

      return;
    }

    /* PRODUCTS */
    cart.forEach((item,index)=>{

      let qty =
        item.qty || 1;

      let itemTotal =
        item.price * qty;

      total += itemTotal;

      container.innerHTML += `

        <div class="cart-item">

          <div class="cart-item-image">

            <img
              class="cart-product-image"

              src="${
                item.image ||
                'https://via.placeholder.com/100'
              }"

              alt="${item.name}"
            >

          </div>

          <div class="cart-item-info">

            <h3>
              ${item.name}
            </h3>

            <p class="cart-price">
              ₹${item.price}
            </p>

            <div class="qty-box">

              <button
                onclick="changeQty(${index},'dec')"
              >
                −
              </button>

              <span>
                ${qty}
              </span>

              <button
                onclick="changeQty(${index},'inc')"
              >
                +
              </button>

            </div>

          </div>

          <div class="cart-item-right">

            <h4>
              ₹${itemTotal}
            </h4>

            <button
              class="remove-btn"
              onclick="removeFromCart(${index})"
            >

              Remove

            </button>

          </div>

        </div>

      `;
    });

    /* TOTAL */
    totalBox.innerHTML = `

      <div class="summary-row">

        <span>
          Subtotal
        </span>

        <span>
          ₹${total}
        </span>

      </div>

      <div class="summary-row">

        <span>
          Delivery
        </span>

        <span>
          FREE
        </span>

      </div>

      <div class="summary-total">

        <span>
          Total
        </span>

        <span>
          ₹${total}
        </span>

      </div>

      <button
        class="checkout-btn"
        onclick="goToCheckout()"
      >

        Proceed To Checkout

      </button>

      <button
        class="clear-cart-btn"
        onclick="clearCart()"
      >

        Clear Cart

      </button>

    `;
  }

  /* ================= CHECKOUT ================= */
  function goToCheckout(){

    let cart =
      JSON.parse(
        localStorage.getItem("cart")
      ) || [];

    if(cart.length === 0){

      alert(
        "Your cart is empty 🛒"
      );

      return;
    }

    window.location.href =
      "checkout.html";
  }

  /* ================= REMOVE ================= */
  function removeFromCart(index){

    let cart =
      JSON.parse(
        localStorage.getItem("cart")
      ) || [];

    cart.splice(index,1);

    localStorage.setItem(
      "cart",
      JSON.stringify(cart)
    );

    renderCartPage();

    updateCartCount();
  }

  /* ================= QTY ================= */
  function changeQty(index,type){

    let cart =
      JSON.parse(
        localStorage.getItem("cart")
      ) || [];

    if(type === "inc"){

      cart[index].qty++;

    } else {

      if(cart[index].qty > 1){

        cart[index].qty--;

      } else {

        cart.splice(index,1);
      }
    }

    localStorage.setItem(
      "cart",
      JSON.stringify(cart)
    );

    renderCartPage();

    updateCartCount();
  }

  /* ================= CLEAR ================= */
  function clearCart(){

    if(
      confirm(
        "Clear your entire cart?"
      )
    ){

      localStorage.removeItem(
        "cart"
      );

      renderCartPage();

      updateCartCount();
    }
  }

  /* ================= INIT ================= */
  document.addEventListener(
    "DOMContentLoaded",
    ()=>{

      renderCartPage();

      updateCartCount();
    }
  );


</script>

</body>
</html>
