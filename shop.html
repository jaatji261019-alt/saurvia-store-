<!DOCTYPE html>
<html>
<head>
  <title>Shop - Saurvia Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- TOP HEADER -->
<div class="top-header">
  <h1 class="logo">SAURAVIA</h1>

  <div class="search-box">
    <input type="text" placeholder="Search products...">
  </div>

  <div class="cart-box">
    <a href="cart.html">🛒 Cart</a>
  </div>
</div>

<!-- NAVIGATION -->
<div class="shop-nav">
  <a href="index.html">🏠 Home</a>
  <a href="shop.html">🛍️ Shop</a>
  <a href="cart.html">🛒 Cart</a>
</div>

<!-- SHOP TITLE -->
<div class="shop-title">
  <h2>Our Products</h2>
  <p>Best Skincare, Perfumes & Haircare Collection</p>
</div>

<!-- PRODUCTS GRID -->
<div class="products">

  <div class="product">
    <img src="images/serum.jpg">
    <h2>Face Serum</h2>
    <p>₹299</p>
    <button onclick="buyNow('Face Serum', 299)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="images/perfume.jpg">
    <h2>Perfume</h2>
    <p>₹499</p>
    <button onclick="buyNow('Perfume', 499)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="images/cream.jpg">
    <h2>Skin Cream</h2>
    <p>₹199</p>
    <button onclick="buyNow('Skin Cream', 199)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="images/hair.jpg">
    <h2>Hair Oil</h2>
    <p>₹249</p>
    <button onclick="buyNow('Hair Oil', 249)">Add to Cart</button>
  </div>

</div>

<!-- FOOTER -->
<div class="footer">
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="cart.html">Cart</a>
    <a href="#">Contact</a>
    <a href="#">About</a>
  </div>

  <p>© 2026 Saurvia Store | All Rights Reserved</p>
</div>

<script src="script.js"></script>

</html>
