<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop - Saurvia Store</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ===== MOBILE MENU BUTTON ===== -->
<div class="menu-btn" onclick="toggleSidebar()">☰</div>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">

  <h2>SAURVIA</h2>

  <nav>
    <a href="index.html">🏠 Home</a>
    <a href="shop.html" class="active">🛍️ Shop</a>
    <a href="cart.html">🛒 Cart</a>
  </nav>

  <h3>Filters</h3>

  <div class="filter">
    <p>Category</p>
    <label><input type="checkbox"> Skincare</label>
    <label><input type="checkbox"> Perfume</label>
    <label><input type="checkbox"> Haircare</label>
  </div>

  <div class="filter">
    <p>Price</p>
    <label><input type="checkbox"> ₹100 - ₹300</label>
    <label><input type="checkbox"> ₹300 - ₹500</label>
  </div>

</aside>

<!-- ===== MAIN ===== -->
<main class="main">

<!-- ===== HEADER ===== -->
<header class="header">

  <h1>SAURVIA</h1>

  <input type="text" placeholder="Search products...">

  <a href="cart.html" class="cart">🛒 Cart</a>

</header>

<!-- ===== HERO ===== -->
<section class="hero">

  <img src="images/shop-banner.jpg"
  onerror="this.src='https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9';">

  <div class="hero-text">
    <h2>Premium Beauty Collection ✨</h2>
    <p>Best skincare & beauty products</p>
  </div>

</section>

<!-- ===== PRODUCTS ===== -->
<section class="shop-layout">

  <!-- PRODUCT GRID -->
  <div class="products">

    <!-- CARD -->
    <div class="card">
      <img src="images/serum.jpg">
      <h4>Face Serum</h4>
      <p class="price">₹299</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="images/perfume.jpg">
      <h4>Luxury Perfume</h4>
      <p class="price">₹499</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="images/cream.jpg">
      <h4>Skin Cream</h4>
      <p class="price">₹199</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="images/hair.jpg">
      <h4>Hair Oil</h4>
      <p class="price">₹249</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="images/lotion.jpg">
      <h4>Body Lotion</h4>
      <p class="price">₹349</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="images/shampoo.jpg">
      <h4>Shampoo</h4>
      <p class="price">₹399</p>
      <button>Add to Cart</button>
    </div>

  </div>

</section>

<!-- ===== FOOTER ===== -->
<footer class="footer">
  <p>© 2026 SAURVIA STORE</p>
</footer>

</main>

<script>
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("show");
}
</script>

</body>
</html>
