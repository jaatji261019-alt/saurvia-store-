<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Product Details - SAURVIA
  </title>

  <!-- MAIN CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- PRODUCT CSS -->
  <link rel="stylesheet" href="product.css">

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

</head>

<body>

<!-- ================= MENU BUTTON ================= -->
<div
  class="menu-btn"
  onclick="toggleSidebar()"
>
  <i class="fa-solid fa-bars"></i>
</div>

<!-- ================= SIDEBAR ================= -->
<div
  class="sidebar"
  id="sidebar"
>

  <h2>
    SAURVIA
  </h2>

  <!-- NAV -->
  <div class="sidebar-nav">

    <a href="index.html">
      <i class="fa-solid fa-house"></i>
      Home
    </a>

    <a href="shop.html">
      <i class="fa-solid fa-shop"></i>
      Shop
    </a>

    <a href="wishlist.html">
      <i class="fa-solid fa-heart"></i>
      Wishlist
    </a>

    <a href="cart.html">
      <i class="fa-solid fa-cart-shopping"></i>
      Cart
    </a>

    <a href="checkout.html">
      <i class="fa-solid fa-credit-card"></i>
      Checkout
    </a>

  </div>

</div>

<!-- ================= HEADER ================= -->
<header class="top-header">

  <div class="center-box">

    <h1 class="logo">
      SAURVIA
    </h1>

  </div>

  <!-- CART -->
  <div class="cart-box">

    <a
      href="cart.html"
      class="cart-count"
    >
      🛒 Cart (0)
    </a>

  </div>

</header>

<!-- ================= PRODUCT PAGE ================= -->
<section class="product-page">

  <!-- LEFT -->
  <div class="product-left">

    <div class="main-product-image">

      <img
        id="mainProductImage"
        src="images/serum1.jpg"
        alt="Face Serum"
        onerror="this.src='https://via.placeholder.com/600x600';"
      >

    </div>

    <!-- THUMBNAILS -->
    <div class="thumbnail-row">

      <img
        src="images/serum1.jpg"
        class="active-thumb"
        onclick="changeMainImage(this)"
      >

      <img
        src="images/perfume.jpg"
        onclick="changeMainImage(this)"
      >

      <img
        src="images/hair.jpg"
        onclick="changeMainImage(this)"
      >

    </div>

  </div>

  <!-- RIGHT -->
  <div class="product-right">

    <p class="product-brand">
      SAURVIA BEAUTY
    </p>

    <h1 class="product-title">
      Premium Face Serum With Vitamin C
    </h1>

    <p class="short-desc">

      Brightens skin, removes dark spots and gives instant glow ✨

    </p>

    <!-- PRICE -->
    <div class="price-section">

      <span class="new-price">
        ₹299
      </span>

      <span class="old-price">
        ₹599
      </span>

      <span class="discount">
        50% OFF
      </span>

    </div>

    <!-- QUANTITY -->
    <div class="quantity-box">

      <h4>
        Quantity:
      </h4>

      <div class="qty-controls">

        <button onclick="decreaseQty()">
          −
        </button>

        <span id="qty">
          1
        </span>

        <button onclick="increaseQty()">
          +
        </button>

      </div>

    </div>

    <!-- BUTTONS -->
    <div class="product-buttons">

      <!-- ADD TO CART -->
      <button
        class="add-cart-btn"
        onclick="addProductToCart()"
      >

        <i class="fa-solid fa-cart-shopping"></i>

        Add To Cart

      </button>

      <!-- BUY NOW -->
      <button
        class="buy-btn"
        onclick="buyProductNow()"
      >

        <i class="fa-solid fa-bolt"></i>

        Buy Now

      </button>

      <!-- WISHLIST -->
      <button
        class="wishlist-product-btn wishlist-btn"

        data-product="Premium Face Serum With Vitamin C"

        onclick="toggleWishlist(
          this,
          'Premium Face Serum With Vitamin C',
          299,
          document.getElementById('mainProductImage').src
        )"
      >

        <i class="fa-regular fa-heart"></i>

        Wishlist

      </button>

    </div>

  </div>

</section>

<!-- ================= RELATED PRODUCTS ================= -->
<section class="related-products">

  <h2>
    Related Products 🔥
  </h2>

  <div class="products">

    <!-- PRODUCT -->
    <div class="product">

      <img
        src="images/perfume.jpg"
        alt="Perfume"
      >

      <h3>
        Luxury Perfume
      </h3>

      <p>
        ₹499
      </p>

      <div class="product-actions">

        <button
          class="cart-btn"
          onclick="buyNow(
            'Luxury Perfume',
            499,
            'images/perfume.jpg'
          )"
        >

          Add To Cart

        </button>

        <!-- WISHLIST -->
        <button
          class="wishlist-btn"

          data-product="Luxury Perfume"

          onclick="toggleWishlist(
            this,
            'Luxury Perfume',
            499,
            'images/perfume.jpg'
          )"
        >

          <i class="fa-regular fa-heart"></i>

        </button>

      </div>

    </div>

    <!-- PRODUCT -->
    <div class="product">

      <img
        src="images/hair.jpg"
        alt="Hair Oil"
      >

      <h3>
        Hair Care Oil
      </h3>

      <p>
        ₹349
      </p>

      <div class="product-actions">

        <button
          class="cart-btn"
          onclick="buyNow(
            'Hair Care Oil',
            349,
            'images/hair.jpg'
          )"
        >

          Add To Cart

        </button>

        <!-- WISHLIST -->
        <button
          class="wishlist-btn"

          data-product="Hair Care Oil"

          onclick="toggleWishlist(
            this,
            'Hair Care Oil',
            349,
            'images/hair.jpg'
          )"
        >

          <i class="fa-regular fa-heart"></i>

        </button>

      </div>

    </div>

  </div>

</section>

<!-- ================= FOOTER ================= -->
<footer class="footer">

  <p>
    © 2026 SAURVIA STORE
  </p>

</footer>

<!-- ================= SCRIPT ================= -->
<script src="script.js"></script>

<!-- ================= PRODUCT PAGE SCRIPT ================= -->
<script>

let qty = 1;

/* ================= CHANGE IMAGE ================= */
function changeMainImage(element){

  let mainImage =
    document.getElementById(
      "mainProductImage"
    );

  mainImage.src = element.src;

  let thumbs =
    document.querySelectorAll(
      ".thumbnail-row img"
    );

  thumbs.forEach(img => {

    img.classList.remove(
      "active-thumb"
    );

  });

  element.classList.add(
    "active-thumb"
  );
}

/* ================= QTY ================= */
function increaseQty(){

  qty++;

  document.getElementById(
    "qty"
  ).innerText = qty;
}

function decreaseQty(){

  if(qty > 1){

    qty--;

    document.getElementById(
      "qty"
    ).innerText = qty;
  }
}

/* ================= ADD PRODUCT ================= */
function addProductToCart(){

  let image =
    document.getElementById(
      "mainProductImage"
    ).src;

  let existing =
    cart.find(
      item =>
        item.name.toLowerCase() ===
        "premium face serum with vitamin c"
        .toLowerCase()
    );

  if(existing){

    existing.qty += qty;

  } else {

    cart.push({

      id: Date.now(),

      name:
        "Premium Face Serum With Vitamin C",

      price: 299,

      image: image,

      qty: qty

    });
  }

  saveCart();

  updateCartCount();

  showToast(
    "Product added to cart 🛒"
  );
}

/* ================= BUY NOW ================= */
function buyProductNow(){

  addProductToCart();

  window.location.href =
    "checkout.html";
}

/* ================= INIT ================= */
document.addEventListener(
  "DOMContentLoaded",
  () => {

    updateCartCount();

    loadWishlistButtons();

  }
);

</script>

</body>
</html>
