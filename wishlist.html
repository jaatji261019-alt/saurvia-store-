<!-- ================= WISHLIST SCRIPT ================= -->
<script>

/* ================= RENDER WISHLIST ================= */

function renderWishlist(){

  let container =
    document.getElementById(
      "wishlistContainer"
    );

  if(!container) return;

  container.innerHTML = "";

  /* EMPTY WISHLIST */
  if(wishlist.length === 0){

    container.innerHTML = `

      <div class="empty-wishlist">

        <img
          src="https://cdn-icons-png.flaticon.com/512/1077/1077035.png"
          width="120"
        >

        <h2>
          Wishlist is Empty 💔
        </h2>

        <p>
          Save products you love
        </p>

        <a
          href="shop.html"
          class="shop-btn"
        >
          Continue Shopping
        </a>

      </div>

    `;

    return;
  }

  /* PRODUCTS */
  wishlist.forEach((product, index) => {

    let card =
      document.createElement("div");

    card.className =
      "wishlist-card";

    card.innerHTML = `

      <!-- IMAGE -->
      <div class="wishlist-image">

        <img
          src="${
            product.image ||
            'https://via.placeholder.com/300x250'
          }"

          alt="${product.name}"

          onerror="
            this.src=
            'https://via.placeholder.com/300x250';
          "
        >

      </div>

      <!-- INFO -->
      <div class="wishlist-info">

        <h3>
          ${product.name}
        </h3>

        <p class="wishlist-price">
          ₹${product.price}
        </p>

        <div class="wishlist-rating">
          ⭐⭐⭐⭐⭐ (4.9)
        </div>

        <!-- BUTTONS -->
        <div class="wishlist-buttons">

          <!-- ADD TO CART -->
          <button
            class="wishlist-cart-btn"
            onclick="moveToCart(${index})"
          >

            <i class="fa-solid fa-cart-shopping"></i>

            Add To Cart

          </button>

          <!-- REMOVE -->
          <button
            class="wishlist-remove-btn"
            onclick="removeFromWishlist(${index})"
          >

            <i class="fa-solid fa-trash"></i>

            Remove

          </button>

        </div>

      </div>

    `;

    container.appendChild(card);

  });

}

/* ================= REMOVE WISHLIST ================= */

function removeFromWishlist(index){

  let productName =
    wishlist[index].name;

  wishlist.splice(index, 1);

  saveWishlist();

  renderWishlist();

  showToast(
    productName +
    " removed from wishlist 💔"
  );
}

/* ================= MOVE TO CART ================= */

function moveToCart(index){

  let item =
    wishlist[index];

  if(!item) return;

  buyNow(
    item.name,
    item.price,
    item.image
  );

  wishlist.splice(index, 1);

  saveWishlist();

  renderWishlist();

  showToast(
    item.name +
    " moved to cart 🛒"
  );
}

/* ================= INIT ================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    updateCartCount();

    renderWishlist();

  }
);

</script>
