<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Wishlist - SAURVIA STORE
  </title>

  <!-- MAIN CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- WISHLIST CSS -->
  <link rel="stylesheet" href="wishlist.css">

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

</head>

<body>

<!-- ================= MENU BUTTON ================= -->
<div
  class="menu-btn"
  onclick="toggleSidebar()"
>

  <i class="fa-solid fa-bars"></i>

</div>

<!-- ================= SIDEBAR ================= -->
<aside
  class="sidebar"
  id="sidebar"
>

  <!-- LOGO -->
  <div class="sidebar-logo">

    <h2>
      SAURVIA
    </h2>

  </div>

  <!-- NAV -->
  <nav class="sidebar-nav">

    <a href="index.html">

      <i class="fa-solid fa-house"></i>

      Home

    </a>

    <a href="shop.html">

      <i class="fa-solid fa-shop"></i>

      Shop

    </a>

    <a
      href="wishlist.html"
      class="active-link"
    >

      <i class="fa-solid fa-heart"></i>

      Wishlist

    </a>

    <a href="cart.html">

      <i class="fa-solid fa-cart-shopping"></i>

      Cart

    </a>

    <a href="checkout.html">

      <i class="fa-solid fa-credit-card"></i>

      Checkout

    </a>

    <a href="about.html">

      <i class="fa-solid fa-circle-info"></i>

      About

    </a>

    <a href="contact.html">

      <i class="fa-solid fa-phone"></i>

      Contact

    </a>

  </nav>

  <!-- CATEGORY BUTTON -->
  <div
    class="cat-toggle"
    onclick="toggleCategories()"
  >

    📂 Categories

  </div>

  <!-- CATEGORY LIST -->
  <div
    class="sidebar-categories"
    id="catMenu"
  >

    <div class="side-cat">

      <img
        src="images/skincare.jpg"
        alt="Skincare"
      >

      <span>
        Skincare
      </span>

    </div>

    <div class="side-cat">

      <img
        src="images/perfume.jpg"
        alt="Perfume"
      >

      <span>
        Perfume
      </span>

    </div>

    <div class="side-cat">

      <img
        src="images/haircare.jpg"
        alt="Haircare"
      >

      <span>
        Haircare
      </span>

    </div>

    <div class="side-cat">

      <img
        src="images/beauty.jpg"
        alt="Beauty"
      >

      <span>
        Beauty
      </span>

    </div>

  </div>

</aside>

<!-- ================= MAIN ================= -->
<main class="main">

<!-- ================= HEADER ================= -->
<header class="top-header">

  <div class="center-box">

    <h1 class="logo">
      SAURVIA
    </h1>

  </div>

  <!-- CART -->
  <div class="cart-box">

    <a href="cart.html">

      🛒 Cart (
      <span id="cartCount">
        0
      </span>
      )

    </a>

  </div>

</header>

<!-- ================= TITLE ================= -->
<section class="wishlist-title">

  <h1>
    My Wishlist ❤️
  </h1>

  <p>
    Your favorite beauty products saved here
  </p>

</section>

<!-- ================= WISHLIST ================= -->
<section
  class="wishlist-container"
  id="wishlistContainer"
>

</section>

<!-- ================= FOOTER ================= -->
<footer class="footer">

  <div class="footer-links">

    <a href="index.html">

      <i class="fa-solid fa-house"></i>

      <span>
        Home
      </span>

    </a>

    <a href="shop.html">

      <i class="fa-solid fa-shop"></i>

      <span>
        Shop
      </span>

    </a>

    <a href="wishlist.html">

      <i class="fa-solid fa-heart"></i>

      <span>
        Wishlist
      </span>

    </a>

    <a href="cart.html">

      <i class="fa-solid fa-cart-shopping"></i>

      <span>
        Cart
      </span>

    </a>

    <a href="checkout.html">

      <i class="fa-solid fa-credit-card"></i>

      <span>
        Checkout
      </span>

    </a>

    <a href="about.html">

      <i class="fa-solid fa-circle-info"></i>

      <span>
        About
      </span>

    </a>

    <a href="contact.html">

      <i class="fa-solid fa-phone"></i>

      <span>
        Contact
      </span>

    </a>

  </div>

  <p>

    © 2026 SAURVIA STORE <br>

    All Rights Reserved

  </p>

</footer>

</main>

<!-- ================= SCRIPT ================= -->
<script src="script.js"></script>

</body>
</html>
