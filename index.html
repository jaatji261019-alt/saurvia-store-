<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sauravia Store</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔥 SIDEBAR -->
<aside class="sidebar">
  <h2>SAURAVIA</h2>
  <nav>
    <a href="#">Home</a>
    <a href="shop.html">Shop</a>
    <a href="cart.html">Cart</a>
    <a href="#">Checkout</a>
    <a href="#">Contact</a>
    <a href="#">About</a>
  </nav>
</aside>

<!-- 🔥 MAIN -->
<main class="main">

  <!-- 🔥 HEADER -->
  <header class="top-header">
    <div class="center-box">
      <h1 class="logo">SAURAVIA</h1>
      <input type="text" placeholder="Search skincare, perfumes, haircare...">
    </div>
  </header>

  <!-- 🔥 SLIDER -->
  <section class="slider">

    <!-- Slide 1 -->
    <div class="slide active" style="background-image:url('images/skincare.jpg')">
      <div class="overlay"></div>
      <div class="content">
        <h2>Glow With Premium Skincare ✨</h2>
        <p>Best products for your daily routine</p>
        <a href="shop.html" class="btn">Shop Now</a>
      </div>
    </div>

    <!-- Slide 2 -->
    <div class="slide" style="background-image:url('images/perfume.jpg')">
      <div class="overlay"></div>
      <div class="content">
        <h2>Luxury Perfumes 💎</h2>
        <p>Smell elegant & feel confident</p>
        <a href="shop.html" class="btn">Shop Now</a>
      </div>
    </div>

    <!-- Slide 3 -->
    <div class="slide" style="background-image:url('images/haircare.jpg')">
      <div class="overlay"></div>
      <div class="content">
        <h2>Strong & Healthy Hair 💇‍♀️</h2>
        <p>Shine & strength products</p>
        <a href="shop.html" class="btn">Shop Now</a>
      </div>
    </div>

  </section>

</main>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
