<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saurvia Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <h2>SAURVIA</h2>

  <nav>
    <a href="#">Home</a>
    <a href="shop.html">Shop</a>
    <a href="cart.html">Cart</a>
    <a href="#">Checkout</a>
    <a href="#">Contact</a>
    <a href="#">About</a>
  </nav>

  <div class="sidebar-categories">

    <div class="side-cat">
      <img src="images/skincare.jpg">
      <span>Skincare</span>
    </div>

    <div class="side-cat">
      <img src="images/perfume.jpg">
      <span>Perfume</span>
    </div>

    <div class="side-cat">
      <img src="images/haircare.jpg">
      <span>Haircare</span>
    </div>

    <div class="side-cat">
      <img src="images/beauty.jpg">
      <span>Beauty</span>
    </div>

  </div>
</aside>

<!-- MAIN -->
<main class="main">

<header class="top-header">
  <div class="center-box">
    <h1 class="logo">SAURVIA</h1>
    <input type="text" placeholder="Search...">
  </div>

  <div class="cart-box">
    <a href="cart.html">🛒 Cart (0)</a>
  </div>
</header>

<!-- HERO -->
<section class="hero-banner">
  <img src="images/skincare-main.jpg">
</section>

<!-- CATEGORIES -->
<section class="categories">

  <div class="category">
    <img src="images/skincare.jpg">
    <p>Skincare</p>
  </div>

  <div class="category">
    <img src="images/perfume.jpg">
    <p>Perfume</p>
  </div>

  <div class="category">
    <img src="images/haircare.jpg">
    <p>Haircare</p>
  </div>

  <div class="category">
    <img src="images/beauty.jpg">
    <p>Beauty</p>
  </div>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
