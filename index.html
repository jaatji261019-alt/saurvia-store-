<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    SAURVIA STORE
  </title>

  <!-- MAIN CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

</head>

<body>

<!-- ================= MENU BUTTON ================= -->
<div
  class="menu-btn"
  onclick="toggleSidebar()"
>

  <i class="fa-solid fa-bars"></i>

</div>

<!-- ================= SIDEBAR ================= -->
<aside
  class="sidebar"
  id="sidebar"
>

  <!-- LOGO -->
  <div class="sidebar-logo">

    <h2>
      SAURVIA
    </h2>

  </div>

  <!-- NAVIGATION -->
  <nav class="sidebar-nav">

    <a href="index.html">

      <i class="fa-solid fa-house"></i>

      Home

    </a>

    <a href="shop.html">

      <i class="fa-solid fa-shop"></i>

      Shop

    </a>

    <a href="wishlist.html">

      <i class="fa-solid fa-heart"></i>

      Wishlist

    </a>

    <a href="cart.html">

      <i class="fa-solid fa-cart-shopping"></i>

      Cart

    </a>

    <a href="checkout.html">

      <i class="fa-solid fa-credit-card"></i>

      Checkout

    </a>

  </nav>

</aside>

<!-- ================= MAIN ================= -->
<main class="main">

  <!-- ================= HEADER ================= -->
  <header class="top-header">

    <!-- CENTER -->
    <div class="center-box">

      <h1 class="logo">
        SAURVIA
      </h1>

      <!-- SEARCH -->
      <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
      >

    </div>

    <!-- CART -->
    <div class="cart-box">

      <a
        href="cart.html"
        class="cart-count"
      >

        🛒 Cart (0)

      </a>

    </div>

  </header>

  <!-- ================= HERO ================= -->
  <section class="hero-banner">

    <img
      src="images/skincare-main.jpg"
      alt="Banner"
      onerror="this.src='https://via.placeholder.com/1200x500';"
    >

    <div class="hero-text">

      <h1>
        Glow Naturally ✨
      </h1>

      <p>
        Premium skincare products
      </p>

      <a
        href="shop.html"
        class="btn"
      >

        Shop Now

      </a>

    </div>

  </section>

  <!-- ================= PRODUCTS ================= -->
  <section class="products">

    <!-- ================= PRODUCT 1 ================= -->
    <div
      class="product-card"
      data-category="beauty"
    >

      <div class="product-badge">

        25% OFF

      </div>

      <!-- ❤️ WISHLIST -->
      <button
        class="wishlist-btn"
        data-product="Face Serum"
        onclick="toggleWishlist(
          this,
          'Face Serum',
          299,
          'images/serum.jpg'
        )"
      >

        <i class="fa-regular fa-heart"></i>

      </button>

      <!-- IMAGE -->
      <div class="product-image-box">

        <img
          src="images/serum.jpg"
          alt="Face Serum"
          onerror="this.src='https://via.placeholder.com/300x200';"
        >

      </div>

      <!-- INFO -->
      <div class="product-info">

        <h3>
          Face Serum
        </h3>

        <p class="price">
          ₹299
        </p>

        <div class="product-rating">

          ⭐⭐⭐⭐⭐ (4.9)

        </div>

        <div class="product-actions">

          <!-- CART -->
          <button
            class="cart-btn"
            onclick="buyNow(
              'Face Serum',
              299,
              'images/serum.jpg'
            )"
          >

            Add To Cart

          </button>

          <!-- VIEW -->
          <button
            class="view-btn"
            onclick="location.href='product.html'"
          >

            View

          </button>

        </div>

      </div>

    </div>

    <!-- ================= PRODUCT 2 ================= -->
    <div
      class="product-card"
      data-category="perfume"
    >

      <div class="product-badge">

        HOT

      </div>

      <!-- ❤️ WISHLIST -->
      <button
        class="wishlist-btn"
        data-product="Perfume"
        onclick="toggleWishlist(
          this,
          'Perfume',
          499,
          'images/perfume.jpg'
        )"
      >

        <i class="fa-regular fa-heart"></i>

      </button>

      <!-- IMAGE -->
      <div class="product-image-box">

        <img
          src="images/perfume.jpg"
          alt="Perfume"
          onerror="this.src='https://via.placeholder.com/300x200';"
        >

      </div>

      <!-- INFO -->
      <div class="product-info">

        <h3>
          Perfume
        </h3>

        <p class="price">
          ₹499
        </p>

        <div class="product-rating">

          ⭐⭐⭐⭐⭐ (4.8)

        </div>

        <div class="product-actions">

          <!-- CART -->
          <button
            class="cart-btn"
            onclick="buyNow(
              'Perfume',
              499,
              'images/perfume.jpg'
            )"
          >

            Add To Cart

          </button>

          <!-- VIEW -->
          <button
            class="view-btn"
            onclick="location.href='product.html'"
          >

            View

          </button>

        </div>

      </div>

    </div>

    <!-- ================= PRODUCT 3 ================= -->
    <div
      class="product-card"
      data-category="skincare"
    >

      <div class="product-badge">

        SALE

      </div>

      <!-- ❤️ WISHLIST -->
      <button
        class="wishlist-btn"
        data-product="Skin Cream"
        onclick="toggleWishlist(
          this,
          'Skin Cream',
          199,
          'images/cream.jpg'
        )"
      >

        <i class="fa-regular fa-heart"></i>

      </button>

      <!-- IMAGE -->
      <div class="product-image-box">

        <img
          src="images/cream.jpg"
          alt="Skin Cream"
          onerror="this.src='https://via.placeholder.com/300x200';"
        >

      </div>

      <!-- INFO -->
      <div class="product-info">

        <h3>
          Skin Cream
        </h3>

        <p class="price">
          ₹199
        </p>

        <div class="product-rating">

          ⭐⭐⭐⭐☆ (4.5)

        </div>

        <div class="product-actions">

          <!-- CART -->
          <button
            class="cart-btn"
            onclick="buyNow(
              'Skin Cream',
              199,
              'images/cream.jpg'
            )"
          >

            Add To Cart

          </button>

          <!-- VIEW -->
          <button
            class="view-btn"
            onclick="location.href='product.html'"
          >

            View

          </button>

        </div>

      </div>

    </div>

  </section>

</main>

<!-- ================= SCRIPT ================= -->
<script src="script.js"></script>

</body>
</html>
